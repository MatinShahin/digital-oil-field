 data-k="km">1.03</b><i>km</i></span></div><div class="kpi"><span class="kpi-l">Monitor well</span><span class="kpi-v"><b data-k="mon">clear</b></span></div></div><div class="ctl-row"><label for="ctl-yr">Year</label><input type="range" id="ctl-yr" min="0" max="25" step="0.5" value="12"><output for="ctl-yr" data-out>year 12</output></div><div class="ctl-btns"><button type="button" class="ctl-b" data-v="5">Year 5</button><button type="button" class="ctl-b" data-v="14">Year 14</button><button type="button" class="ctl-b" data-v="25">Year 25</button><button type="button" class="ctl-b" data-act="play">Pause tour</button></div></div><figcaption class="iso-legend"><span class="xp-parts"><button type="button" class="xp-part" data-part="barrel"><span class="xp-num">01</span>Pump barrel</button><button type="button" class="xp-part" data-part="rotor"><span class="xp-num">02</span>Impeller stack</button><button type="button" class="xp-part" data-part="guard"><span class="xp-num">03</span>Coupling guard</button><button type="button" class="xp-part" data-part="motor"><span class="xp-num">04</span>Pump motor</button><button type="button" class="xp-part" data-part="door"><span class="xp-num">05</span>Pig receiver closure</button><button type="button" class="xp-part" data-part="master"><span class="xp-num">06</span>Master valve</button><button type="button" class="xp-part" data-part="ssv"><span class="xp-num">07</span>Safety valve and actuator</button><button type="button" class="xp-part" data-part="cross"><span class="xp-num">08</span>Flow cross</button><button type="button" class="xp-part" data-part="cap"><span class="xp-num">09</span>Cap and pressure gauge</button></span><span class="iso-caption">CO₂ from a capture plant arrives by pipeline, passes the pig receiver and a meter, and a ten-stage pump sends it down the well as a dense fluid at 1 Mt a year. In the aquifer it fills the pore space and, lighter than the brine around it, rises and spreads under the shale caprock, so the plume is widest at the top. Its size follows a simple volume balance: radius = √(M / (ρ·π·h·φ·S)) with ρ = 700 kg/m³, h = 100 m, porosity 0.2 and saturation 0.5, widened 1.35× at the top for gravity override. After 25 years 25 Mt is stored and the plume reaches about 1.44 km; the monitoring well 1.05 km out sees it around year 13. Depths not to scale.</span></figcaption><div class="iso-credit"><span>Energy anatomy · 3 of 3</span><span><b>Developed by Matin Shahin</b></span></div></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
