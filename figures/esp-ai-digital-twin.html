.sp-line{fill:none;stroke:var(--anatomy-hi);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.sp-area{fill:var(--anatomy-hi);opacity:.07}
.sp-th{fill:none;stroke:var(--alarm);stroke-width:1.2;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.sp-ai{fill:none;stroke:var(--ai);stroke-width:1.4;vector-effect:non-scaling-stroke}
.sp-dot{fill:var(--anatomy-card);stroke:var(--anatomy-strong);stroke-width:1.6;vector-effect:non-scaling-stroke}
.twin-legend{margin:0;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font:11px/1 var(--anatomy-mono);color:var(--anatomy-muted)}
.lg{display:inline-block;width:18px;height:0;border-top:2px solid var(--anatomy-hi);margin-right:-8px}
.lg-th{border-top:2px dashed var(--alarm)}
.lg-ai{border-top:2px solid var(--ai)}
.ctl-row{grid-template-columns:auto 1fr auto}

</div><figcaption class="iso-legend"><span class="xp-parts"><button type="button" class="xp-part" data-part="sensor"><span class="xp-num">01</span>Downhole sensor</button><button type="button" class="xp-part" data-part="motor"><span class="xp-num">02</span>Induction motor</button><button type="button" class="xp-part" data-part="protector"><span class="xp-num">03</span>Seal section</button><button type="button" class="xp-part" data-part="intake"><span class="xp-num">04</span>Intake</button><button type="button" class="xp-part" data-part="housing"><span class="xp-num">05</span>Pump housing</button><button type="button" class="xp-part" data-part="rotor"><span class="xp-num">06</span>Impellers and bearings</button><button type="button" class="xp-part" data-part="head"><span class="xp-num">07</span>Discharge head and tubing</button><button type="button" class="xp-part" data-part="cable"><span class="xp-num">08</span>Power cable</button></span><span class="iso-caption">An electric submersible pump lifts most of the world's artificially produced oil, and when one fails the well stops until a rig pulls it. This twin follows one ESP for 30 days as a bearing at the pump's section joint wears. A conventional system alarms when vibration crosses 0.30 in/s, about 4 days before failure. The AI model watches vibration, motor temperature, current and intake pressure together and flags the trend around day 19, roughly 11 days out and about 6 days before the alarm, early enough to slow the drive from 60 to 52 Hz (which cuts bearing load and slows the wear several-fold) and book the change-out as planned work. The value shown compares an unplanned failure (14 days down plus the workover) with a planned job (3 days), at $70/bbl. Sensor data are simulated for illustration.</span></figcaption><div class="iso-credit"><span>Energy anatomy · AI in oil production</span><span><b>Developed by Matin Shahin</b></span></div></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)

function runsOf(flags, want) {

    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);

function extrude(ring, z, height, projection, options = {}) {

    const normals = ring.map(([ax, ay], index) => {

    state.x = target;
    state.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let index = 0; index < 4; index++) {
    const h = dt / 4;
    state.v += (w * w * (target - state.x) - 2 * w * state.v) * h;
    state.x += state.v * h;

    state.v = 0;
