<div class="ctl-row"><label for="ctl-p">Target</label><input type="range" id="ctl-p" min="60" max="180" step="5" value="120"><output for="ctl-p" data-out>120 bar</output></div><div class="ctl-btns"><button type="button" class="ctl-b" data-v="180">Inject</button><button type="button" class="ctl-b" data-act="hold">Hold</button><button type="button" class="ctl-b" data-v="60">Withdraw</button></div></div><figcaption class="iso-legend"><span class="xp-parts"><button type="button" class="xp-part" data-part="cylinder"><span class="xp-num">01</span>Compressor cylinder</button><button type="button" class="xp-part" data-part="crosshead"><span class="xp-num">02</span>Piston rod and crosshead</button><button type="button" class="xp-part" data-part="cover"><span class="xp-num">03</span>Crankcase cover</button><button type="button" class="xp-part" data-part="flywheel"><span class="xp-num">04</span>Flywheel</button><button type="button" class="xp-part" data-part="motor"><span class="xp-num">05</span>Drive motor</button><button type="button" class="xp-part" data-part="master"><span class="xp-num">06</span>Master valve</button><button type="button" class="xp-part" data-part="ssv"><span class="xp-num">07</span>Safety valve and actuator</button><button type="button" class="xp-part" data-part="cross"><span class="xp-num">08</span>Flow cross</button><button type="button" class="xp-part" data-part="cap"><span class="xp-num">09</span>Cap and pressure gauge</button><button type="button" class="xp-part" data-part="fans"><span class="xp-num">10</span>Electrolyser cooling fans</button></span><span class="iso-caption">Surplus renewable power runs the electrolyser; its hydrogen passes a scrubber and a reciprocating compressor and goes down the well into a cavern leached out of rock salt, which creeps shut around any crack and holds hydrogen tight. The cavern (500,000 m³) works between 60 and 180 bar: the 60 bar of cushion gas always stays in, and everything above it is working gas. Density comes from the real-gas law at 45 °C (Z ≈ 1 + 0.00062·p), so 180 bar holds about 3,970 t of working hydrogen, 132 GWh at its lower heating value. The compressor only runs while it fills; on withdrawal the cavern's own pressure pushes the gas back out. Depths not to scale.</span></figcaption><div class="iso-credit"><span>Energy anatomy · 2 of 3</span><span><b>Developed by Matin Shahin</b></span></div></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
