const lightTheme = () => (root.closest("[data-theme]")?.getAttribute("data-theme") || "dark") === "light" ? 1 : 0;
const layer = typeof glLayer === "function" ? glLayer({ canvas: stage.querySelector(".wh-gl"), fragment: FRAG, view: [D.W, D.H], camera: D.camera, uniforms: ["uLen", "uR", "uLight", "uLit", "uBox"], fixed: { uTip: D.tip } }) : null;
if (layer) stage.setAttribute("data-gl", "");
const flame = { x: 0, v: 0 };
const boxOf = (len) => { const a = iso(D.tip, P), b = iso([D.tip[0] + len * 0.9, D.tip[1], D.tip[2] + len * 2.5], P); const pad = 12 + len * 0.25; return [Math.min(a[0], b[0]) - pad, Math.min(a[1], b[1]) - pad, Math.max(a[0], b[0]) + pad, a[1] + pad]; };
const lit = { x: 0, v: 0 };

const ctl = root.querySelector(".ctl");
const ctlRange = ctl.querySelector('input[type="range"]');
const ctlOut = ctl.querySelector("[data-out]");
const kpi = Object.fromEntries([...ctl.querySelectorAll("[data-k]")].map((el) => [el.dataset.k, el]));
const setK = (key, text) => { const el = kpi[key]; if (el && el.textContent !== text) el.textContent = text; };
ctlRange.addEventListener("input", () => { pinned = true; beanTarget = +ctlRange.value; quietTour(); run(); });
ctl.querySelectorAll("[data-v]").forEach((b) => b.addEventListener("click", () => { pinned = true; beanTarget = +b.dataset.v; quietTour(); run(); }));

function drawGauges() {
  const q = rateOf(bean), whp = whpOf(bean), ft = flameFt(q);
  spokes.setAttribute("d", spokesD(P, D.choke[0], D.choke[1], D.choke[2], 8, (bean / 64) * Math.PI * 6, 4));
  needle.setAttribute("d", needleD(P, D.T[0], D.T[1], 117.1, 8.4, clamp(whp / 2000, 0, 1)));
  const s = Math.round(bean);
  setK("rate", Math.round(q).toLocaleString("en-US")); setK("whp", String(Math.round(whp))); setK("gas", (q * M.gor / 1e6).toFixed(2)); setK("flame", String(Math.round(ft)));
  if (document.activeElement !== ctlRange && +ctlRange.value !== s) ctlRange.value = String(s);

  const rateTxt = String(Math.round(q)).padStart(4, " ") + " BPD";
  if (sRate.textContent !== rateTxt) { sRate.textContent = rateTxt; sWhp.textContent = "WHP " + Math.round(whp) + " PSI"; }

  if (text !== shown) { shown = text; readout.textContent = text; }
  packets.forEach((list, i) => list.forEach((c, n) => { const len = lens[i][lens[i].length - 1]; const [x, y] = pointAt(i, (flowT * 34 + n * len / 3) % len); c.setAttribute("cx", x.toFixed(2)); c.setAttribute("cy", y.toFixed(2)); }));
  const beat = Math.floor(flowT * 2.5) % 3;
  leds.forEach((l, i) => (i === 0 || i === beat) ? l.setAttribute("data-on", "") : l.removeAttribute("data-on"));
}

const TOUR_STEP = 1.6;
function tourAt(t) {
  const cycle = 3.2 * 4 + 1 + D.order.length * TOUR_STEP + 1.4;
  const u = t % cycle;
  const beans = [20, 40, 64, 32];
  if (u < 3.2 * 4) return { apart: false, part: null, bean: beans[Math.floor(u / 3.2)] };
  const v = u - 3.2 * 4;
  if (v < 1) return { apart: true, part: null };
  if (v < 1 + D.order.length * TOUR_STEP) return { apart: true, part: D.order[Math.floor((v - 1) / TOUR_STEP)] };

}
function quietTour() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (inside) return quietTour(); touring = !still.matches; tourClock = 0; run(); }, 6000);
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const calm = still.matches;
  if (touring) { tourClock += dt; const st = tourAt(tourClock); setApart(st.apart); select(st.part); if (st.bean && !pinned) beanTarget = st.bean; }

  drawGauges();

  settle(flame, flameFt(q) * 2.3, dt, 0.5, calm);
  settle(lit, 1, dt, 0.6, calm);
  stage.dataset.flame = flame.x.toFixed(1);
  if (layer) layer.draw({ uLen: flame.x, uR: 5.5 + flame.x * 0.06, uLight: lightTheme(), uLit: lit.x, uBox: boxOf(flame.x) }, calm ? 0.8 : clock);
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
function run() { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } }
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
function pieceAt(ev) { const hit = document.elementFromPoint(ev.clientX, ev.clientY); const it = hit && hit.closest ? hit.closest(".it") : null; return it ? it.dataset.piece : null; }
stage.addEventListener("pointermove", (ev) => { if (ev.pointerType === "touch") return; inside = true; clearTimeout(leaveTimer); quietTour(); setApart(true); select(pieceAt(ev)); run(); });
stage.addEventListener("pointerleave", () => { inside = false; clearTimeout(leaveTimer); leaveTimer = setTimeout(() => { if (inside) return; select(null); setApart(false); }, 300); });
stage.addEventListener("pointerdown", (ev) => { if (ev.pointerType !== "touch") return; quietTour(); const id = pieceAt(ev); if (!id || id === "stand") { select(null); setApart(!apart); } else { setApart(true); select(id); } run(); });
apartBtn.addEventListener("click", () => { quietTour(); setApart(!apart); if (!apart) select(null); run(); });
partButtons.forEach((b) => {
  const show = () => { quietTour(); clearTimeout(leaveTimer); setApart(true); select(b.dataset.part); run(); };
  b.addEventListener("pointerenter", show); b.addEventListener("focus", show); b.addEventListener("click", show);
  b.addEventListener("pointerleave", () => { clearTimeout(leaveTimer); leaveTimer = setTimeout(() => { if (inside || partButtons.some((o) => o.matches(":hover, :focus-visible"))) return; select(null); setApart(false); }, 300); });
});
stage.addEventListener("keydown", (ev) => {
  const i = selected ? D.order.indexOf(selected) : -1;
  let next = null;
  if (ev.key === "ArrowRight" || ev.key === "ArrowDown") next = Math.min(D.order.length - 1, i + 1);
  else if (ev.key === "ArrowLeft" || ev.key === "ArrowUp") next = Math.max(0, i - 1);

  else if (ev.key === " ") { ev.preventDefault(); quietTour(); setApart(!apart); if (!apart) select(null); run(); return; }
  if (next === null) return;

});
const narrow = matchMedia("(hover: none), (max-width: 480px)");
const wording = () => { hint.textContent = narrow.matches ? "Tap the tree or a part" : "Hover the tree to take it apart"; };
wording(); narrow.addEventListener("change", wording);
window.addEventListener("resize", () => run());
if (still.matches) touring = false;
place();
drawGauges();
if (still.matches && layer) layer.draw({ uLen: flameFt(rateOf(bean)) * 2.3, uR: 8, uLight: lightTheme(), uLit: 1, uBox: boxOf(flameFt(rateOf(bean)) * 2.3) }, 0.8);
